return`<h1>System Health & Predictive Maintenance</h1><div class="card" style="border-color:#fbbf2466;background:linear-gradient(180deg,#2a2110,#0d1424)"><div class="am"><b style="font-size:16px">CAM-24 may fail in about 10 minutes</b>${bd('PREDICTED FAILURE','var(--am)')}</div><div class="kv" style="margin-top:12px"><div><small>Camera</small>CAM-24</div><div><small>Location</small>Hall C</div><div><small>Current health</small>64%</div><div><small>Estimated time</small>~10 minutes</div><div><small>Reason</small>Rising packet loss + abnormal temperature</div></div></div>

<div class="card"><h2>Confirmed vs false positives</h2><div class="hb"><span>Weapon</span><div class="tk"><i style="width:60%;--c:var(--gr)"></i><i style="width:40%;--c:var(--or)"></i></div><b>3/2</b></div><div class="hb"><span>Theft</span><div class="tk"><i style="width:70%;--c:var(--gr)"></i><i style="width:30%;--c:var(--or)"></i></div><b>7/3</b></div><div class="hb"><span>Restricted</span><div class="tk"><i style="width:85%;--c:var(--gr)"></i><i style="width:15%;--c:var(--or)"></i></div><b>11/2</b></div><div class="mu" style="font-size:12px">Green confirmed · orange false positive</div></div>
<div class="card"><h2>Camera health</h2>${hbars([['Healthy',46,H.gr],['Degraded',1,H.am],['Offline',1,H.rd]])}</div></div>`},

function tgDemo(){S.demo=!S.demo;render();toast('Demo simulation '+(S.demo?'on':'off'))}

let vp=0;function closeM(){clearInterval(vp);vp=0;$('#m').classList.remove('on')}

openM(`<div><button class="x" onclick="closeM()">×</button><div class="am"><h1>${a.id}</h1>${bd(a.sev)}</div><div class="mu">${a.type}</div></div>
